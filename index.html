<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Alfred</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06110c">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#06110c;--panel:#0b1912;--card:#112419;--line:#1b3326;--tx:#e4f1e9;--mut:#7c9a89;--ac:#3ddc97;--acx:#03130b;--user:#13301f;--glow:#0e2e1e}
[data-theme=light]{--bg:#f3faf6;--panel:#e8f3ec;--card:#dcece3;--line:#cfe3d6;--tx:#0f2218;--mut:#587364;--ac:#168a57;--acx:#fff;--user:#d9efe2;--glow:#e3f5ea}
@media(prefers-color-scheme:light){[data-theme=auto]{--bg:#f3faf6;--panel:#e8f3ec;--card:#dcece3;--line:#cfe3d6;--tx:#0f2218;--mut:#587364;--ac:#168a57;--acx:#fff;--user:#d9efe2;--glow:#e3f5ea}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg) radial-gradient(110% 55% at 50% -8%,var(--glow),transparent) no-repeat;color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
header .t{flex:1;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.ib:active{background:var(--card)}
#load{padding:8px 14px;font-size:13px;color:var(--mut);background:var(--panel);border-bottom:1px solid var(--line)}
#load i{display:block;height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
#load b{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
#msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth;overscroll-behavior:contain}
.w{max-width:760px;margin:0 auto}
.m{display:flex;gap:10px;margin:0 auto 18px;max-width:760px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.u{justify-content:flex-end}
.m.u .b{background:var(--user);border:1px solid var(--line);padding:10px 14px;border-radius:20px 20px 6px 20px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.av{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;margin-top:1px;display:block}
.a .body{min-width:0;flex:1}
.c p{margin:0 0 .7em}.c h2,.c h3,.c h4,.c h5{margin:.9em 0 .4em;line-height:1.3}
.c ul,.c ol{margin:0 0 .7em;padding-left:1.3em}.c a{color:var(--ac)}
.c code{background:var(--card);padding:2px 6px;border-radius:6px;font:.88em ui-monospace,Menlo,monospace}
.code{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:.6em 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
.cp{font-size:12px;color:var(--mut);padding:2px 8px;border-radius:8px}.cp:active{background:var(--card)}
.code pre{margin:0;padding:12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,monospace}
.cur{display:inline-block;width:8px;height:16px;background:var(--ac);border-radius:2px;vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.acts{display:flex;gap:2px;margin-top:2px}.acts button{font-size:12px;color:var(--mut);padding:4px 10px;border-radius:10px}.acts button:active{background:var(--card)}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;animation:in .4s}
.empty .av{width:96px;height:96px;margin:0 auto;box-shadow:0 0 40px #3ddc9755}.empty h1{font-size:24px;margin:10px 0 0}.empty p{color:var(--mut);margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:420px}
.chip{border:1px solid var(--line);border-radius:16px;padding:8px 14px;font-size:14px;background:var(--panel)}.chip:active{background:var(--card)}
footer{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 16px;transition:border-color .2s}
#box:focus-within{border-color:var(--ac)}
#in{flex:1;resize:none;border:0;outline:0;background:none;color:var(--tx);font:inherit;max-height:160px;padding:8px 0}
#go{width:38px;height:38px;border-radius:50%;background:var(--ac);color:var(--acx);display:grid;place-items:center;transition:transform .15s,opacity .2s}
#go:active{transform:scale(.9)}#go:disabled{opacity:.35}
#mic{width:38px;height:38px;border-radius:50%;font-size:18px}#mic.on{background:#e5484d;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}
small{display:block;text-align:center;color:var(--mut);font-size:11px;margin-top:6px}
#scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
#scrim.on{opacity:1;pointer-events:auto}
#side{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:320px;background:var(--panel);z-index:6;transform:translateX(-100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#side.on{transform:none}
#nc{background:var(--ac);color:var(--acx);padding:12px;border-radius:14px;font-weight:600;margin-bottom:10px}
#list{flex:1;overflow-y:auto}
.ci{display:flex;align-items:center;border-radius:12px;padding:0 4px 0 12px}.ci.on{background:var(--card)}
.ci span{flex:1;padding:11px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px}
.ci button{color:var(--mut);width:36px;height:36px}
#sbtn{padding:12px;border-radius:12px;text-align:left;border-top:1px solid var(--line)}
#sheet{position:fixed;inset:0;z-index:9;display:none;align-items:flex-end;background:#0009}
#sheet.on{display:flex}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:var(--tx);padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;max-width:90%;text-align:center;animation:in .25s}
#sheet .p{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;animation:up .3s cubic-bezier(.3,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.p h3{margin:0 0 12px}.p label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.p input,.p select,.p textarea{width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
.p input[type=range]{padding:0}
.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1;padding:12px;border-radius:12px;background:var(--card)}
.row .pr{background:var(--ac);color:var(--acx);font-weight:600}.row .dg{color:#e5484d}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="menu" aria-label="Chats">☰</button>
    <div class="t" id="title">New chat</div>
    <button class="ib" id="nt" aria-label="New chat">✎</button>
  </header>
  <div id="load"><span id="lt">Starting…</span><i><b id="bar"></b></i></div>
  <div id="msgs"></div>
  <footer>
    <div id="box">
      <textarea id="in" rows="1" placeholder="Loading model…"></textarea>
      <button id="mic" aria-label="Voice">🎤</button>
      <button id="go" aria-label="Send" disabled></button>
    </div>
    <small>Runs 100% on your phone · private</small>
  </footer>
</div>
<div id="scrim"></div>
<aside id="side">
  <button id="nc">＋ New chat</button>
  <div id="list"></div>
  <button id="sbtn">⚙️ Settings</button>
</aside>
<div id="sheet"><div class="p">
  <h3>Settings</h3>
  <label>AI name</label><input id="s-name">
  <label>Model (downloads once, then works offline)</label><select id="s-model"></select>
  <label>Personality / instructions</label><textarea id="s-sys" rows="4"></textarea>
  <label>Creativity: <span id="tv"></span></label><input id="s-temp" type="range" min="0" max="1.2" step="0.1">
  <label>Theme</label><select id="s-theme"><option value="auto">Auto</option><option value="dark">Dark</option><option value="light">Light</option></select>
  <div class="row"><button class="dg" id="s-clear">Delete all chats</button><button class="pr" id="s-done">Done</button></div>
</div></div>

<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");</script>

  for(const ln of esc(p).split("\n")){let m;
    if(m=ln.match(/^(#{1,4})\s+(.*)/)){cl();o+=`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`}
    else if(m=ln.match(/^\s*([-*]|\d+\.)\s+(.*)/)){const t=/\d/.test(m[1])?"ol":"ul";if(ls!==t){cl();o+=`<${t}>`;ls=t}o+=`<li>${inl(m[2])}</li>`}
    else if(!ln.trim())cl();else{cl();o+=`<p>${inl(ln)}</p>`}}
  cl();return o}).join("")}

/* ui */
const msgs=$("#msgs"),inp=$("#in"),go=$("#go");
go.innerHTML=SEND;
msgs.addEventListener("scroll",()=>{stick=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<80});
const down=()=>{if(stick)msgs.scrollTop=msgs.scrollHeight};
function setGo(){go.innerHTML=busy?STOP:SEND;go.disabled=busy?false:!inp.value.trim();
  inp.placeholder=ready?`Message ${S.set.name}`:"Loading model…"}
function msgEl(m,last){const d=document.createElement("div");
  if(m.role==="user"){d.className="m u";const b=document.createElement("div");b.className="b";b.textContent=m.content;d.appendChild(b);return d}
  d.className="m a";d.innerHTML=`<img class="av" src="${ICON}" alt=""><div class="body"><div class="c"></div><div class="acts"></div></div>`;
  d.querySelector(".c").innerHTML=md(m.content);
  if(!(busy&&last)){const a=d.querySelector(".acts");a.innerHTML=`<button data-a="copy">Copy</button>${last?'<button data-a="regen">↻ Regenerate</button>':""}`}
  return d}
function render(){const c=cur();msgs.innerHTML="";$("#title").textContent=c?c.title:"New chat";
  if(!c||!c.msgs.length){msgs.innerHTML=`<div class="empty"><img class="av" src="${ICON}" alt=""><h1>Hi, I'm ${esc(S.set.name)}</h1><p>Your private AI, living on your phone.</p><div class="chips">${["Explain something simply","Help me write a message","Give me a fun fact","Teach me some code"].map(t=>`<button class="chip">${t}</button>`).join("")}</div></div>`;return}
  c.msgs.forEach((m,i)=>msgs.appendChild(msgEl(m,i===c.msgs.length-1)));stick=true;down()}
function renderList(){const l=$("#list");l.innerHTML="";
  [...S.chats].sort((a,b)=>b.ts-a.ts).forEach(c=>{const d=document.createElement("div");d.className="ci"+(c.id===S.cur?" on":"");d.dataset.id=c.id;
    d.innerHTML=`<span>${esc(c.title)}</span><button data-del="1" aria-label="Delete">✕</button>`;l.appendChild(d)})}
const drawer=o=>{$("#side").classList.toggle("on",o);$("#scrim").classList.toggle("on",o)};
function newChat(){const c={id:Date.now().toString(36),title:"New chat",msgs:[],ts:Date.now()};S.chats.push(c);S.cur=c.id;save();return c}
function openNew(){if(busy)return;const c=cur();if(!c||c.msgs.length)newChat();render();renderList();drawer(false)}

/* markdown painting with rAF throttle */
let raf=0;function paint(el,t){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;el.innerHTML=md(t)+'<span class="cur"></span>';down()})}

/* model */
async function load(){loadFailed=false;ready=false;setGo();$("#load").style.display="";$("#bar").style.width="0";
  try{if(!navigator.gpu)throw new Error("This browser has no WebGPU. Use Chrome on a recent Android phone or Safari on iOS 18+.");
    lib=lib||await import("https://esm.run/@mlc-ai/web-llm");
    if(engine){try{await engine.unload()}catch{}}
    engine=await lib.CreateMLCEngine(S.set.model,{initProgressCallback:p=>{$("#bar").style.width=(p.progress*100)+"%";$("#lt").textContent=p.text.slice(0,90)}});
    ready=true;$("#load").style.display="none"}
  catch(e){loadFailed=true;$("#lt").textContent="⚠️ "+e.message+" (tap to retry)"}
  setGo();if(ready&&pending){const p=pending;pending=null;send(p)}}
$("#load").onclick=()=>{if(loadFailed)load()};

/* generation */
async function gen(c){busy=true;setGo();render();
  const last=c.msgs[c.msgs.length-1],el=msgs.lastElementChild.querySelector(".c");el.innerHTML='<span class="cur"></span>';
  let acc="";
  try{const sys=S.set.sys.replace(/\{name\}/g,S.set.name);
    const st=await engine.chat.completions.create({messages:[{role:"system",content:sys},...c.msgs.slice(0,-1)],stream:true,temperature:+S.set.temp});
    for await(const ch of st){acc+=ch.choices[0]?.delta?.content||"";last.content=acc;paint(el,acc)}}
  catch(e){if(!acc)last.content="⚠️ "+e.message}
  if(!last.content.trim())last.content="(stopped)";
  busy=false;c.ts=Date.now();save();cancelAnimationFrame(raf);raf=0;render();renderList();setGo()}
let pending=null,loadFailed=false;
function toast(m){document.getElementById("toast")?.remove();const d=document.createElement("div");d.id="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
addEventListener("error",e=>toast("Error: "+e.message));
addEventListener("unhandledrejection",e=>toast("Error: "+(e.reason?.message||e.reason)));
function send(t){t=t.trim();if(!t||busy)return;
  if(!ready){pending=t;inp.value="";fit();toast(loadFailed?"Model failed to load. Tap the top banner to retry.":"Model still loading. I'll send this when it's ready.");return}
  const c=cur()||newChat();if(!c.msgs.length)c.title=t.slice(0,40);
  c.msgs.push({role:"user",content:t},{role:"assistant",content:""});inp.value="";fit();renderList();gen(c)}

/* events */
const fit=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";setGo()};
inp.addEventListener("input",fit);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();go.click()}});
go.onclick=()=>busy?engine.interruptGenerate():send(inp.value);
$("#menu").onclick=()=>drawer(true);$("#scrim").onclick=()=>drawer(false);
$("#nt").onclick=openNew;$("#nc").onclick=openNew;
$("#list").onclick=e=>{const d=e.target.closest(".ci");if(!d||busy)return;
  if(e.target.dataset.del){S.chats=S.chats.filter(c=>c.id!==d.dataset.id);if(S.cur===d.dataset.id)S.cur=null;save();render()}
  else{S.cur=d.dataset.id;render()}renderList();if(!e.target.dataset.del)drawer(false)};
msgs.onclick=e=>{const t=e.target;
  if(t.classList.contains("chip"))send(t.textContent);
  if(t.classList.contains("cp")){navigator.clipboard?.writeText(t.closest(".code").querySelector("pre").textContent);t.textContent="Copied ✓";setTimeout(()=>t.textContent="Copy",1500)}
  if(t.dataset.a==="copy"){const c=cur(),i=[...msgs.children].indexOf(t.closest(".m"));navigator.clipboard?.writeText(c.msgs[i].content);t.textContent="Copied ✓";setTimeout(()=>t.textContent="Copy",1500)}
  if(t.dataset.a==="regen"&&!busy&&ready){const c=cur();c.msgs[c.msgs.length-1].content="";gen(c)}};
/* voice */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
if(!SR)$("#mic").style.display="none";
$("#mic").onclick=()=>{if(rec){rec.stop();return}
  rec=new SR();rec.interimResults=true;rec.lang=navigator.language;const base=inp.value?inp.value+" ":"";
  rec.onresult=e=>{inp.value=base+[...e.results].map(r=>r[0].transcript).join("");fit()};
  rec.onend=()=>{rec=null;$("#mic").classList.remove("on")};rec.onerror=()=>{};
  $("#mic").classList.add("on");rec.start()};
/* settings */
$("#s-model").innerHTML=MODELS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join("");
function fill(){const s=S.set;$("#s-name").value=s.name;$("#s-model").value=s.model;$("#s-sys").value=s.sys;$("#s-temp").value=s.temp;$("#tv").textContent=s.temp;$("#s-theme").value=s.theme}
const theme=()=>document.documentElement.dataset.theme=S.set.theme;
$("#sbtn").onclick=()=>{fill();drawer(false);$("#sheet").classList.add("on")};
$("#s-temp").oninput=e=>$("#tv").textContent=e.target.value;
$("#s-clear").onclick=()=>{if(busy||!confirm("Delete all chats?"))return;S.chats=[];S.cur=null;save();render();renderList()};
$("#s-done").onclick=()=>{const old=S.set.model;
  S.set={v3:1,name:$("#s-name").value.trim()||"Alfred",model:$("#s-model").value,sys:$("#s-sys").value||DEF.sys,temp:$("#s-temp").value,theme:$("#s-theme").value};
  save();theme();$("#sheet").classList.remove("on");render();setGo();if(S.set.model!==old&&!busy)load()};
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#s-done").click()};

theme();render();renderList();setGo();load();
</script>
</body>
</html>
